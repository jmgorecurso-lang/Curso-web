<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto 4</title>
  <link rel="stylesheet" href="estilor4.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
</head>

<body>
  <main id="contenedor">

    <header>
      <h1>Formulario de Registro</h1>
      <h4>Completa todos los campos para crear tu perfil</h4>
    </header>


    <form action="" method="get" onsubmit="return abrirPagina(event)">
      <div class="datos">
        <h2><span>📝</span> Información Personal</h2>
        <label for="nombre">Nombre:</label>
        <input type="text" placeholder="Ej. Juan José" id="nombre" name="nombre" autofocus required pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚüÜ\s]+$" min="3" title="Solo letras">

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚüÜ\s]+$" min="3" title="Solo letras">
        <label for="text">Correo Electrónico:</label>
        <input type="email" placeholder="ejemplo@mail.com" id="email" name="email" required pattern="^[^@\s]+@[^@\s]+\.[^@\s]{2,}$">
        <label for="password">Contraseña:</label>
        <input type="text" placeholder="8 caracteres,letras y numeros" id="password" name="password" required pattern="^(?=.*[a-zA-Z].*[a-zA-Z].*[a-zA-Z].*[a-zA-Z])(?=.*\d.*\d.*\d.*\d)[a-zA-Z\d]{8}$" title="4 letras y 4 numeros"><br>
        <!--Regex: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,}$-->
        <small><span>🔒</span>Requisitos: 4 letras y 4 numeros</small>
      </div>
      <div class="masdatos">
        <h2><span>📊</span> Datos Adicionales</h2>
        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha"><br>

        <label for="edad">Edad:</label><output name="total" for="edad">44</output>
        <input type="range" list="years" id="edad" name="edad" min="18" max="99" value="38" oninput="total.value = parseInt(edad.value)">
        <datalist id="years">
          <option value="18" label="18"></option>
          <option value="40" label="40"></option>
          <option value="60" label="60"></option>
          <option value="99" label="99"></option>
        </datalist><br>
        <br>
        <label for="telefono">Telefono:</label>
        <input type="text" id="telefono" name="telefono" required pattern="^\+34[6-9][0-9]{8}$" value="+34"><br>
        <small><span>📱</span>Formato: +34 y 9 digitos</small>
      </div>
      <div class="preferencias">
        <h2><span>🎨</span>Preferencias</h2>
        <h3>color preferido:</h3>
        <label for="color_preferido">Cual es tu color favorito?</label>
        <input type="color" id="color_preferido" name="color_preferido"><br>
        <h2>Hobby:</h2>
        <label for="hobby"></label>
        <select name="hobby" id="hobby">
          <option name="hobby" value="cine"><span>🎬</span>Cine</option>
          <option name="hobby" value="dormir"><span>😴</span>Dormir</option>
          <option name="hobby" value="leer"><span>📚</span>Leer</option>
          <option name="hobby" value="games"><span>🎮</span>Video Juegos</option>
        </select>
        <h2>Foto de perfil</h2>

        <label for="foto"></label>
        <input type="file" id="foto" accept="image/PNG, image/JPEG, image/JPG" name="foto">
        <small><span>📷</span>Formato permitido: JPG, JPEG, PNG maximo 5Mb</small>


      </div>
      <div id="termino">

      <input type="checkbox" id="checkbox" onchange="funciona()">
      <label for="condicion">Acepto los<i> terminos y condiciones</i></label>

      <!-- <input type="submit" id="registro" disabled> -->
      <div class="botones">
        <button id="registro" type="submit" disabled>Registrame</button>


        <script>
          function funciona() {
            const checkbox = document.getElementById('checkbox');
            const button = document.getElementById('registro');
            button.disabled = !checkbox.checked;
          }
          function abrirPagina(event) {
        event.preventDefault(); // Evita que el formulario se envíe realmente
        window.location.href= "confirmado.html";
          }
        </script>
        <input type="reset" name="reset" id="reset" value="Borrar">
      </div>
      </div>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
