<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto 4</title>
  <link rel="stylesheet" href="estiloreto4.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
</head>

<body>
  <main id="contenedor">
  <header>
    <h1>Formulario de Registro</h1>
    <h4>Completa todos los campos para crear tu perfil</h4>
  </header>

    <form action="">
      <div class="datos">
        <h3><span>📝</span> Información Personal</h3>
        <label for="nombre">Nombre:</label>
        <input type="text" placeholder="Ej. Juan José" id="nombre" name="nombre" autofocus>
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos">
        <label for="email">Correo Electrónico:</label>
        <input type="email" placeholder="ejemplo@mail.com" id="email" name="email">
        <label for="password">Contraseña:</label>
        <input type="text" placeholder="8 caracteres,letras y numeros" id="password" name="password">
      </div>
      <div class="masdatos">
        <h2>Datos Adicionales</h2>
        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha"><br>

        <label for="edad">Edad:</label><output name="total" for="edad">44</output>
        <input type="range" list="years" id="edad" name="edad" min="18" max="99" value="38" oninput="total.value = parseInt(edad.value)">
        <datalist id="years">
          <option value="18" label="18"></option>
          <option value="40" label="40"></option>
          <option value="60" label="60"></option>
          <option value="99" label="99"></option>
        </datalist><br>
        <br>
        <label for="telefono">Telefono:</label>
        <input type="number" id="telefono" name="telefono">
      </div>
      <div class="preferencias">
        <h2>Preferencias</h2>
        <h3>color preferido:</h3>
        <label for="color_preferido">Cual es tu color favorito?</label>
        <input type="color" id="color_preferido" name="color_preferido"><br>
        <h3>Hobby:</h3>
        <label for="hobby"></label>
        <select name="hobby" id="hobby">
          <option name="hobby" value="cine">Cine</option>
          <option name="hobby" value="dormir">Dormir</option>
          <option name="hobby" value="leer">Leer</option>
          <option name="hobby" value="games">Video Juegos</option>
        </select>
        <h3>Foto de perfil</h3>
        <label for="foto"></label>
        <input type="file" id="foto">


        <!--foto de perfil: //fileselectorbutto//
      acepto condiciones-->

      </div>
      <div class="termino">


        <input type="checkbox" id="checkbox" onchange="funciona()">
        <label for="condicion">Acepto</label>

        <!-- <input type="submit" id="registro" disabled> -->
        <button id="registro" type="submit" disabled>Registrame</button>


        <script>
          function funciona() {
            const checkbox = document.getElementById('checkbox');
            const button = document.getElementById('registro');
            button.disabled = !checkbox.checked;
          }
        </script>
        <input type="reset" name="reset" id="reset" value="Borrar">
      </div>
    </form>

                // Habilita el botón si el checkbox está marcado
                boton.disabled = !checkbox.checked;
            }-->
  </main>
</body>
</html>
