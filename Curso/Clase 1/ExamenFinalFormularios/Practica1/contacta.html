<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Stalinist+One&display=swap" rel="stylesheet">
  <title>Contacta</title>
</head>
<style>
  :root {
    --radio-todo: 8px;
  }

  body {
    background: #a1a1a1;
    background-color: rgba(224, 222, 222, 0.6);
    background-image: url(https://plus.unsplash.com/premium_photo-1661882403999-46081e67c401?q=80&w=1129&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
    background-repeat: no-repeat;
    background-size: 100%;
    background-blend-mode: overlay;
  }

  .container {
    display: flex;
    gap: 10px;
    max-width: 1200px;
    margin: 0 auto;


  }

  h1 {
    text-align: center;
    font-family: "Stalinist One", sans-serif;
    text-shadow: 0px 2px 6px white;
  }

  h2 {
    margin-top: 30px;
    margin-left: 10px;
  }

  label {
    font-weight: bold;
    margin-top: 10px;
    margin-left: 10px;

  }

  input,
  select {
    padding: 10px;
    margin-left: 10px;
    margin-top: 10px;
    margin-right: 10px;
    border-color: #2633D1;
    border-radius: var(--radio-todo);
  }

  /* Primera letra en mayuscula */
  #nombre {
    text-transform: capitalize;
  }

  .formulario {
    flex: 1;
    border-radius: var(--radio-todo);
    background: rgb(244, 246, 247);
    height: 630px;
    margin-left: 10px;
    margin-top: 15px;
    font-family: "Nunito", sans-serif;
    box-shadow: 0px 3px 5px 1px rgb(44, 44, 44);

  }

  /*contenedor donde se encuentra nombre y apellido */
  .datos {
    display: flex;
    gap: 20px;

  }

  /*esto es el nombre, el apellido...*/
  .escribe {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
    justify-content: space-around;

  }

  .comenta {
    display: flex;
    flex-direction: row;

  }

  textarea {
    height: 200px;
    padding: 10px;
    margin-top: 10px;
    margin-left: 10px;
    margin-right: 10px;
    border-color: #2633D1;
    border-radius: var(--radio-todo);
  }

  .enviar {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
  }

  #submit {
    background: #2633D1;
    color: white;
    width: 100%;
    padding: 15px;
    font-size: larger;
    border-radius: var(--radio-todo);
  }

  #submit:hover {
    width: 98%;
    background: #5E6AF2;
    font-weight: bolder;
    color: #9D9EA1;
  }

  #submit:active {
    width: 95%;
    font-size: medium;
    color: black;
  }

  input:user-invalid {
    border-color: red;
    background: palevioletred;
  }

  input:user-valid {
    background: rgba(157, 243, 157, 0.705);
  }

  .mapa {
    flex: 1;
    width: 50%;
    height: 630px;
    margin-right: 10px;
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    border-radius: var(--radio-todo);
    box-shadow: 0px 3px 5px 1px rgb(44, 44, 44);
  }

  .mapa iframe {
    border-radius: var(--radio-todo);
    height: 100%;
    box-shadow: 0px 3px 5px 1px rgb(44, 44, 44);
  }

</style>

<body>
  <h1>Contactanos</h1>
  <div class="container">

    <div class="formulario">
      <form action="" method="POST" onsubmit="alert ('Todo correcto, enviado')" >

        <div class="datos">
          <div class="escribe">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre completo" required autofocus pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚüÜ]+(\s+[A-Za-zñÑáéíóúÁÉÍÓÚüÜ]+)*$">
          </div>

        </div>
        <div class="datos">
          <div class="escribe">
            <label for="mail">Correo Electrónico:</label>
            <input type="text" id="mail" name="mail" required pattern="^[^@\s]+@[^@\s]+\.[^@\s]{2,}$">
          </div>
        </div>
        <div class="escribe">
          <label for="departamento">Servicios de Interes </label>
          <select name="departamento" id="departamento">
            <option value="" disabled selected>Selecciona un servicio...</option>
            <option name="departamento" value="design">Diseño Web</option>
            <option name="departamento" value="pagina">Paginas Web</option>
            <option name="departamento" value="java">JavaScript</option>
            <option name="departamento" value="seo">Posicionamiento Web</option>
          </select>
        </div>


        <div class="comenta">
          <div class="escribe">
            <label for="mensaje">Mensaje:</label>
            <textarea name="mensaje" id="mensaje" required minlength="20"></textarea>
          </div>

        </div>
        <div class="enviar">
          <input type="submit" name="submit" id="submit" value="Enviar Mensaje">
        </div>
      </form>

    </div>
    <div class="mapa">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1775.2157858746764!2d2.1063773907912933!3d41.557444010201316!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a4951e0def384f%3A0x77b3d5bb7a370747!2sCreatiu%20i%20T%C3%A8cnic%20Sabadell!5e0!3m2!1ses!2ses!4v1777541954642!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

  </div>

</body>
</html>
