<body>
  <header>
    <h1>Reto 6 \/ Contacta con Nosotros</h1>
    <p>Estamos aqui para ayudarte y to eso</p>
  </header>
  <div class="container">

    <div class="formulario">
      <form action="https://formsubmit.co/jmgorecurso@gmail.com" method="POST">
        <h2>Envianos un mensaje</h2>
        <div class="datos">
          <div class="escribe">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required autofocus pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚüÜ]+(\s+[A-Za-zñÑáéíóúÁÉÍÓÚüÜ]+)*$">
          </div>
          <div class="escribe">
            <label for="apellido">Apellidos:</label>
            <input type="text" id="apellido" name="apellido" required pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚüÜ]+(\s+[A-Za-zñÑáéíóúÁÉÍÓÚüÜ]+)*$">
          </div>
        </div>
        <div class="datos">
          <div class="escribe">
          <label for="mail">Correo Electrónico:</label>
          <input type="text" id="mail" name="mail" required pattern="^[^@\s]+@[^@\s]+\.[^@\s]{2,}$">
          </div>
          <div class="escribe">
          <label for="asunto">Asunto:</label>
          <input type="text" id="asunto" name="asunto" required min="3">

          </div>

        </div>
        <div class="comenta">
          <div class="escribe">
          <label for="comentario">Comentarios:</label>
          <textarea name="comentario" id="comentario" required minlength="20"></textarea>
          </div>

        </div>
        <div class="enviar">
          <input type="submit" name="submit" id="submit" value="Enviar Mensaje">
        </div>
      </form>

    </div>
