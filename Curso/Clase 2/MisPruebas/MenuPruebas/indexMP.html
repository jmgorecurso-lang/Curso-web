<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estiloMP.css">
  <title>PagPruebas</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <span class="emblema">☣️</span>
        <h2>ToolTech</h2>

      </div>
      <div class="menu">
        <a href="#">Home</a>
        <a href="#">Servicios</a>
        <a href="#">Desarrollo Web</a>
        <a href="#">Marketing</a>

      </div>

    </div>
    <div class="main">
      <div class="nosotros">
        <img src="https://images.unsplash.com/photo-1575314027842-c33656c1f3dc?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjQwfHxjb2RlfGVufDB8MXwwfHx8MA%3D%3D" alt="">
        <div class="texto">
        <h2>Consultoría Informática</h2>
<p>CUANDO SABES QUE TODO TIENE SOLUCIÓN<br>
Estamos a tu lado para que la informática sea tu gran aliada en el crecimiento de tu negocio. </p>
</div>

      </div>
      <form action="" class="miFormulario">
        <div class="datos">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" placeholder="nombre y apellidos" required minlength="5">

        </div>
        <div class="masDatos">
          <div class="correo">
          <label for="mail">Email</label>
          <input type="email" id="mail" placeholder="correo electrónico">
          </div>
          <div class="phone">
          <label for="telefon">Telefono</label>
          <input type="number" id="telefon">
          </div>

        </div>
        <div class="envio">
          <div class="textbox">
          <label for="mensaje">Mensaje</label>
          <textarea name="" id="mensaje"></textarea>
          </div>
          <div class="check">
          <input type="checkbox" id="pulsa">
          <label for="pulsa">He leido las condiciones de uso</label>

          </div>
          <button type="submit" disabled>Envio</button>

        </div>

      </form>

    </div>

  </div>
  <script src="scrptMP.js"></script>

</body>
</html>
