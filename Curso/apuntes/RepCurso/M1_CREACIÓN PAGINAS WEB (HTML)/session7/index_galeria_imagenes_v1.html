<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galería de Imágenes con Divs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto; font-family: Arial; padding: 20px;">
        <!-- Primera fila - 3 columnas -->
        <div style="display: flex; margin-bottom: 20px; gap: 20px;">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: whitesmoke; font-size: 18px; font-weight: 700; padding: 20px; background-color: red; border-radius: 10px;">
                <img src="image/avatar1.jpg" alt="Imagen 1" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin: 0;">Imagen 1</p>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: whitesmoke; font-size: 18px; font-weight: 700; padding: 20px; background-color: green; border-radius: 10px;">
                <img src="image/avatar2.jpg" alt="Imagen 2" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin: 0;">Imagen 2</p>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: whitesmoke; font-size: 18px; font-weight: 700; padding: 20px; background-color: blue; border-radius: 10px;">
                <img src="image/avatar3.jpg" alt="Imagen 3" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin: 0;">Imagen 3</p>
            </div>
        </div>
        
        <!-- Segunda fila - 2 columnas -->
        <div style="display: flex; margin-bottom: 20px; gap: 20px;">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: whitesmoke; font-size: 18px; font-weight: 700; padding: 20px; background-color: purple; border-radius: 10px;">
                <img src="image/avatar4.jpg" alt="Imagen 4" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin: 0;">Imagen 4</p>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: whitesmoke; font-size: 18px; font-weight: 700; padding: 20px; background-color: orange; border-radius: 10px;">
                <img src="image/avatar5.jpg" alt="Imagen 5" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin: 0;">Imagen 5</p>
            </div>
        </div>
        
        <!-- Tercera fila - 3 columnas -->
        <div style="display: flex; margin-bottom: 20px; gap: 20px;">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: whitesmoke; font-size: 18px; font-weight: 700; padding: 20px; background-color: teal; border-radius: 10px;">
                <img src="image/avatar2.jpg" alt="Imagen 6" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin: 0;">Imagen 6</p>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: whitesmoke; font-size: 18px; font-weight: 700; padding: 20px; background-color: brown; border-radius: 10px;">
                <img src="image/avatar1.jpg" alt="Imagen 7" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin: 0;">Imagen 7</p>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: whitesmoke; font-size: 18px; font-weight: 700; padding: 20px; background-color: rosybrown; border-radius: 10px;">
                <img src="image/avatar3.jpg" alt="Imagen 8" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin: 0;">Imagen 8</p>
            </div>
        </div>
    </div>
</body>
</html>
