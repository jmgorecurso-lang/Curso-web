<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería de Libros Simple</title>
  <style>
    /* ESTILOS BASE - FUNCIONAN */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f8ff; /* Fondo azul claro */
    }
    
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    
    .galeria {
      
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }
    
    .libro {
      position: relative;
      background: white;
      border-radius: 8px;
      /* overflow: hidden; */
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 200px;
      transition: all 0.3s;
      
    }
    
    .libro:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      background: #f5f5f5;
      cursor: pointer;
    }

    
    .libro img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
    
   
    .info {
      padding: 15px;
    }
    
    .info h3 {
      margin: 0 0 5px 0;
      color: #2c3e50;
    }
    
    .autor {
      color: #7f8c8d;
      font-size: 14px;
      margin: 5px 0;
    }
    
    .precio {
      color: #27ae60;
      font-weight: bold;
    }
    
      

    
    
  </style>
</head>
<body>

<h1>Libros Recomendados</h1>
<div class="galeria">
  <!-- Libro 1 -->
  <div class="libro">
    <span class="etiqueta">Popular</span>
    <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Libro de diseño">
    <div class="info">
      <h3>Diseño Web</h3>
      <p class="autor">Por Sarah Johnson</p>
      <p class="precio">$24.99</p>
    </div>
  </div>
  
  <!-- Libro 2 -->
  <div class="libro">
    <span class="etiqueta">Nuevo</span>
    <img src="https://images.unsplash.com/photo-1589998059171-988d887df646?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Libro de programación">
    <div class="info">
      <h3>JavaScript Básico</h3>
      <p class="autor">Por Carlos Mendoza</p>
      <p class="precio">$19.99</p>
    </div>
  </div>
  
  <!-- Libro 3 -->
  <div class="libro">
      <span class="etiqueta">Nuevo</span>
      <img src="https://images.unsplash.com/photo-1541963463532-d68292c34b19?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Libro de poesía">
    <div class="info">
      <h3>Poesía Moderna</h3>
      <p class="autor">Por María González</p>
      <p class="precio">$15.99</p>
    </div>
  </div>
  
  <!-- Libro 4 -->
  <div class="libro">
    <span class="etiqueta">Oferta</span>
    <img src="https://images.unsplash.com/photo-1531346878377-a5be20888e57?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Libro de historia">
    <div class="info">
      <h3>Historia Mundial</h3>
      <p class="autor">Por Roberto Jiménez</p>
      <p class="precio">$29.99</p>
    </div>
  </div>
</div>

</body>
</html>>
