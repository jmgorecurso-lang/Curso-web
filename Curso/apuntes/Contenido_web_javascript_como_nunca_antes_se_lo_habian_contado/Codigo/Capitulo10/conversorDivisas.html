<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="conversorDivisas.css">
</head>
<body>
    <h1>Conversor de divisas a euros</h1>
    <div>
        <input id= "campoDivisa" type="text" size="8" maxlength="10">
        <select id="menuDivisas">
            <option value="libra">
                £ (libras)
            </option>
            <option value="dolar">
                $ (dólares)
             </option>
             <option value="yen">
                ¥ (yenes)
             </option>
        </select>        
        <button id="botonConversion">&#8680;</button>
        <input id= "campoEuro" type="text" size="8" maxlength="10" readonly>
        <p>€ (euros)</p>
    </div>
    <script src="conversorDivisas.js"></script>
</body>
</html>
