<!DOCTYPE html>
<html>

<head>
  <style>
    .imagen-opacidad {
      width: 300px;
      transition: opacity 0.3s;
    }

    .imagen-opacidad:hover {
      opacity: 0.7;

    }

    .imagen-escala {
      width: 300px;
      transition: transform 0.3s;
    }

    .imagen-escala:hover {
      transform: scale(1.05);
      filter: grayscale(100%);
    }

    .imagen-escala:active {
      transform: scale(0.95);
    }

    .imagen-borde {
      width: 300px;
      border: 3px solid transparent;
      transition: all 0.3s;
    }

    .imagen-borde:hover {
      border-color: #3498db;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .imagen-borde:active {
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .imagen-filtro {
      width: 300px;
      transition: filter 0.3s;
    }

    .imagen-filtro:hover {
      filter: brightness(1.1) contrast(1.1);
    }

    .imagen-filtro:active {
      filter: sepia(100%);
    }

    .contenedor-imagen {
      position: relative;
      width: 300px;
    }

    .imagen-texto {
      width: 100%;
      display: block;
    }

    .texto-superpuesto {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      opacity: 0;
      transform: translateY(100%);
      transition: transform 0.3s;
    }

    .contenedor-imagen:hover .texto-superpuesto {
      opacity: 1;
      transform: translateY(0);
    }

    .contenedor-imagen:active .texto-superpuesto {
      background-color: rgba(200, 0, 0, 0.7);
    }

    .texto-centrado {
      position: absolute;
      top: 50%;
      left: 50%;
      /* Ajusta el centro del texto al centro */
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
    }

  </style>
</head>

<body>
  <h1>Clase 5 || CSS IMAGENES &</h1>
  <h2> IMAGEN OPACIDAD </h2>
  <img class="imagen-opacidad" src="https://picsum.photos/300/300?grayscale" alt="Ejemplo hover">

  <h2>IMAGEN ESCALA</h2>
  <img class="imagen-escala" src="https://picsum.photos/id/237/200/300" alt="Ejemplo hover y active">

  <h2>IMAGEN BORDE</h2>
  <img class="imagen-borde" src="https://picsum.photos/id/2/200/300" alt="Ejemplo borde">

  <h2>IMAGEN FILTRO</h2>
  <img class="imagen-filtro" src="https://picsum.photos/300/200" alt="Ejemplo filtro">

  <h2>IMAGEN TEXTO SUPERPUESTO</h2>
  <div class="contenedor-imagen">
    <img class="imagen-texto" src="https://picsum.photos/300/200" alt="Ejemplo texto">
    <div class="texto-superpuesto">Esto aparece como leyenda</div>
  </div>

  <h2>IMAGEN TEXTO CENTRADO</h2>
  <div class="contenedor-imagen">
    <img class="imagen-texto" src="https://picsum.photos/300/200" alt="Ejemplo texto">
    <div class="texto-centrado">Texto al centro</div>
  </div>

</body>

</html>
