<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Configuración</title>
</head>

<body>
    <form>
        <fieldset>
            <legend style="font-size: 24px; font-weight: bold;color: blue;">CONFIGURACIÓN</legend>
            <br>
            <label for="anchoRaqueta" style="font-size: 20px;">Ancho de la raqueta:</label>
            <input type="range" id="anchoRaqueta" min="50" max="150" value="100">
            <br><br>
            <label for="velocidadPelota" style="font-size: 20px;">Velocidad de la pelota:</label>
            <select id="velocidadPelota">
                <option value=1>
                    Normal
                </option>
                <option value=2>
                    Rápida
                </option>
            </select>
            <br><br>
            <button id="confirmar" style="float: right;">Confirmar</button>
            <button id="cancelar" style="float: left;">Cancelar</button>
        </fieldset>
    </form>
    <script src="configuracionFronton.js"></script>
</body>

</html>
