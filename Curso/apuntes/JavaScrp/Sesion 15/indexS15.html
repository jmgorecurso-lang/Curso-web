<!DOCTYPE html>
<html lang="es">
<head>

  <title>Sesion 15</title>

<body>
  <h1 id="titulo">Clase 15 || Eventos en JAvaScript con Select</h1>
  <select id="numberSelect">
    <option value="" disabled selected --Elige un  numero --></option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
  </select>
  <div>
    <img src="https://cdn-icons-png.flaticon.com/128/63/63928.png" width="100" height="100">
  </div>
  <div id="parrafo">
    <p>
    </p>
  </div>
  <!-- otro ejemplo-->
   <div class="ejemplo2">
   <label for="curso">Selecciona un curso:</label><br>
   <select id="curso">
    <option value="">--- Elige un curso ---</option>
    <option value="javascript">JAVASCRIPT BASICO</option>
    <option value="java">JAVA BASICO</option>
    <option value="python">PYTHON AVANZADO</option>
   </select>
   <div class="infoBox" id="infoCurso">
    <h3>Información del curso</h3>
    <div class="infoItem"><strong>Nombre: </strong><span id="cursoNombre"></span> </div>
    <div class="infoItem"><strong>Duracion: </strong><span id="cursoDuracion"></span> </div>
    <div class="infoItem"><strong>Descripcion: </strong><span id="cursoInfo"></span> </div>
   </div>
   <button id="btnLimpia">Eliminar Seleccion</button>
   </div>

<script src="scriptS15.js"></script>
</body>
</html>
