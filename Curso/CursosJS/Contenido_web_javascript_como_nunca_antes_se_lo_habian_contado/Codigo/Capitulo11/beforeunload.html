<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        a{
            float: right;
            color: white;
            background-color: blue;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
        }
        div {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
    <script>
        window.addEventListener('beforeunload', (evento) => {
            evento.preventDefault();
        });
    </script>
</head>
<body>
    <a href="beforeunload2.html">SALIR</a>
    <div>
        <h1>ÁREA DE TRABAJO</h1>
    </div>
</body>
</html>
