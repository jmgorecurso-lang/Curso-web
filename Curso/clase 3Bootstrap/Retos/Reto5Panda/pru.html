<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Forbootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- <script src="scriptPanda.js" defer></script> -->
  <title>Practica 2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      margin: 0 auto;
      text-align: center;
      background-color: #F54927;
      width: 500px;
      height: 105px;
    }

    h2 {
      color: white;
    }

    .container {
      margin: 0 auto;
      display: flex;
      width: 500px;
      border: 1px solid;
    }

    .datos {
      margin-top: 15px;
      margin-left: 15px;
      display: flex;
      flex-direction: column;
      width: 450px;
    }

    .datos input {
      border: 1px solid;
      width: 100%;
    }

    h3 {
      margin-left: 15px;
    }

    .donar {
      background-color: rgba(247, 111, 111, 0.692);
      width: 100%;
      height: 150px;
      border-radius: 9px;
    }

    .plata {
      display: flex;
      justify-content: space-around;

    }



    .check {
      margin-top: 20px;
    }

    .envio {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    .envio button {
      width: 45%;
    }
  .envio button:disabled {
      background-color: rgba(128, 128, 128, 0.479);
      cursor:help;
    }

  </style>

</head>

<body>
  <header>
    <h2><i class="fa-solid fa-paw mt-3"></i><i class="fa-solid fa-tree"></i>
      <i class="fa-solid fa-globe"></i>
    </h2>
    <h2 class="mb-3">Protege al Panda Rojo</h2>
  </header>
  <div class="container">
    <form action="" id="miForm" method="post" onsubmit="alert ('Todo Correcto, enviado 😊')">

      <div class="datos">
        <div class="form-floating mb-2 mt-2">
          <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" name="nombre" pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚüÜ\s]+$" min="3" title="No pongas numeros" required>
          <label for="nombre">Nombre</label>
        </div>
        <div class="form-floating mb-2 mt-2">
          <input type="text" class="form-control" id="apellido" placeholder="Tus apellidos" name="apellido" required pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚüÜ\s]+$" min="3" title="No pongas numeros">
          <label for="apellido">Apellidos</label>
        </div>
        <div class="form-floating mb-2 mt-2">
          <input type="text" class="form-control" id="email" placeholder="Enter email" name="email" required>
          <label for="email">Email</label>
        </div>
      </div>
      <!------------------------------DONACION------------------------------------->

      <h3><span><i class="fa-solid fa-hand-holding-dollar"></i></span>
        Elije tu donación </h3>
      <div class="donar">
        <div class="plata">
          <button type="button" class="btn btn-danger mb-2 mt-2">10 €</button>
          <button type="button" class="btn btn-danger mb-2 mt-2">20 €</button>
          <button type="button" class="btn btn-danger mb-2 mt-2">50 €</button>
          <button type="button" class="btn btn-danger mb-2 mt-2">100 €</button>
          <button type="button" class="btn btn-danger mb-2 mt-2">200 €</button>
        </div>
        <div class="otraCantidad">
          <input type="checkbox" id="otro" name="otro" class="mx-4" onchange="funciona()">
          <label for="otro">💰 Otra cantidad</label>
          <input type="number" id="dinero" placeholder="Pon un precio" hidden>

        </div>
      </div>

      <div class="envio">
        <button type="reset" id="limpiar" class="btn btn-outline-danger mb-2 mt-2"><i class="fa-solid fa-eraser"></i> Borrar</button>

        <button type="submit" id="enviar" class="btn btn-danger mb-2 mt-2" disabled><i class="fa-solid fa-heart"></i> Donar ahora</button>

      </div>
 <script>
            function funciona(){
              const checkbox = document.getElementById('otro');
              const activado = document.getElementById('dinero');
              activado.hidden = !checkbox.checked;
              const libre = document.getElementById('enviar');
              libre.disabled = !checkbox.checked;
            }
          </script>



  </div>
  </form>
  </div>

</body>
</html>
